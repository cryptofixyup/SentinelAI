name: Rust Wire ABI & Golden Vectors

on:
  pull_request:
    paths:
      - 'src/**/*.rs'
      - 'tests/**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-abi.yml'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-rust-abi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Execute Golden Vector & ABI Tests
        run: cargo test --test wire_abi -- --nocapture
