services:
  - type: web
    name: sentinelai-api
    runtime: python
    plan: free
    branch: main
    buildCommand: python -m pip install -r requirements-dev.txt
    startCommand: python -m uvicorn services.api.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
